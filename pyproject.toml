[project]
name = "weather-art-curation"
version = "0.1.0"
description = "Public-domain painting curation pipeline for weather-aware applications"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "numpy>=2.0",
  "pillow>=10.4",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
clip = ["open-clip-torch>=2.26", "torch>=2.4"]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
curation = "curation.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/curation"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 600

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E701", "E702", "UP047"]
